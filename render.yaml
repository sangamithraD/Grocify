# Render Blueprint deployment configuration for Grocify API Server
services:
  - type: web
    name: grocify-api-server
    runtime: node
    rootDir: server
    buildCommand: npm install --production=false && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
