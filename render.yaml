# Render Blueprint deployment configuration for Grocify API Server & PostgreSQL
services:
  - type: web
    name: grocify-api-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: grocify-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: grocify-db
    databaseName: grocify
    user: grocify_user
    plan: free
